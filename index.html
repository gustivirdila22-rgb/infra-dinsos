<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Smart System Dashboard</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial;
}

body {
  background: #f4f6f8;
  color: #333;
}

header {
  background: #1f2a40;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  padding: 30px;
  max-width: 1000px;
  margin: auto;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 20px;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  background: #007bff;
  color: white;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  margin-top: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

.badge {
  display: inline-block;
  margin-top: 10px;
  padding: 5px 10px;
  border-radius: 20px;
  background: #28a745;
  color: white;
  font-size: 12px;
}

/* DARK MODE */
.dark {
  background: #121826;
  color: white;
}

.dark .card {
  background: #1f2a40;
  color: white;
}
</style>
</head>

<body>

<header>
  <h1>Smart System Dashboard</h1>
  <p>Monitoring & Information Panel</p>
</header>

<div class="container">

  <div class="topbar">
    <p id="time">Loading...</p>
    <button onclick="toggleDark()">Toggle Mode</button>
  </div>

  <div class="grid">

    <div class="card">
      <h3>System Status</h3>
      <p>Current system health monitoring</p>
      <div class="badge">ACTIVE</div>
    </div>

    <div class="card">
      <h3>User Activity</h3>
      <p>Tracking user interactions</p>
      <div class="badge">STABLE</div>
    </div>

    <div class="card">
      <h3>Server Info</h3>
      <p>Deployment environment status</p>
      <div class="badge">ONLINE</div>
    </div>

    <div class="card">
      <h3>Notifications</h3>
      <p>System alerts and updates</p>
      <div class="badge">UPDATED</div>
    </div>

  </div>

</div>

<script>
function updateTime(){
  const now = new Date();
  document.getElementById("time").innerText =
    "Current Time: " + now.toLocaleTimeString();
}
setInterval(updateTime, 1000);
updateTime();

function toggleDark(){
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
