      background: #f5f7fa;

    .card {

      border-radius: 5px;
      display: inline-block;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>App Kelompok Dinsos</h1>
    <p>Deploy Infrastruktur Teknologi Informasi</p>

</html>
